repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run --locked --extra generation --extra learner ty check
        language: system
        pass_filenames: false
      - id: tach
        name: tach check
        entry: uv run --locked tach check
        language: system
        pass_filenames: false
        always_run: true

      - id: contract-schemas
        name: generated contract schemas
        entry: uv run --locked python -m mpi_yellow_belt_data.contracts --check
        language: system
        pass_filenames: false
        always_run: true
